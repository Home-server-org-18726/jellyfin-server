name: jellyfin-server

services:
  jellyfin:
    image: jellyfin/jellyfin:12
    user: 1000:1000 # must own the config/cache folders and be able to read media folder(s)
    restart: unless-stopped
    # environment:
    #   - JELLYFIN_PublishedServerUrl=https://your-domain.com/jellyfin
    volumes:
      - "/srv/media/videos/data/config:/config"
      - "/srv/media/videos/data/cache:/cache"
      - "/srv/media/videos/game-captures-new:/media/videos:ro"
    networks:
      - shared-network

networks:
  shared-network:
    name: shared-network
    external: true
