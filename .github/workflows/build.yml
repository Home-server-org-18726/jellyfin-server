name: jellyfin-server-builder

on:
  push:
    branches: [main]

jobs:
  container-builder:
    runs-on: self-hosted
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: Stop delete containers
        run: docker compose down

      - name: Prepare directories and copy network.xml
        run: |
          mkdir -p /srv/media/videos/data/config/config /srv/media/videos/data/cache
          cp config/network.xml /srv/media/videos/data/config/config/network.xml

      - name: Start Containers
        run: docker compose up -d --build